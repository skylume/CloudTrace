<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>CloudTrace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 与主页面同一段首屏脚本：登录页也要先贴主题，否则会闪一下。
      ;(function () {
        var root = document.documentElement
        var ui = null
        try {
          var raw = localStorage.getItem('cloudtrace.ui')
          ui = raw ? JSON.parse(raw) : null
        } catch (e) {
          ui = null
        }
        var theme = (ui && ui.theme) || 'system'
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = theme
        root.dataset.fontScale = (ui && ui.fontScale) || 'medium'
      })()
    </script>
    <script type="module" crossorigin src="/assets/login-Dl7pUeOw.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/base-BYxKxJ8M.js">
    <link rel="stylesheet" crossorigin href="/assets/base-BDhXD09f.css">
    <link rel="stylesheet" crossorigin href="/assets/login-DcFElZ8Q.css">
  </head>
  <body class="login-body">
    <form class="login-card" id="login-form" novalidate>
      <h1>CloudTrace</h1>
      <p class="login-hint" id="login-hint">
        面板已开放局域网访问，请输入启动时控制台打印的访问 Token。
      </p>
      <label class="sr-only" for="login-token">访问 Token</label>
      <input id="login-token" type="password" placeholder="访问 Token" autocomplete="off" autofocus />
      <button type="submit" id="login-submit">登录</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </body>
</html>
