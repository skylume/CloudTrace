<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>CloudTrace · 登录</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 与主页面同一段首屏脚本：登录页也要先贴主题，否则会闪一下。
      ;(function () {
        var root = document.documentElement
        var ui = null
        try {
          var raw = localStorage.getItem('cloudtrace.ui')
          ui = raw ? JSON.parse(raw) : null
        } catch (e) {
          ui = null
        }
        var theme = (ui && ui.theme) || 'system'
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = theme
        root.dataset.fontScale = (ui && ui.fontScale) || 'medium'
      })()
    </script>
    <script type="module" crossorigin src="/assets/login-BhdlN9G5.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/base-BVNRfvsa.js">
    <link rel="stylesheet" crossorigin href="/assets/base-CkFor0UV.css">
    <link rel="stylesheet" crossorigin href="/assets/login-CX4HakaY.css">
  </head>
  <body class="login-body">
    <main class="login-card">
      <header class="login-brand">
        <!-- 品牌标记与侧栏里那个一致：三条递减的横线 + 一个轨迹点。 -->
        <span class="login-mark" aria-hidden="true">
          <i class="bar b1"></i>
          <i class="bar b2"></i>
          <i class="bar b3"></i>
          <i class="dot"></i>
        </span>
        <span class="login-names">
          <h1>CloudTrace</h1>
          <p class="login-tagline">挑出当前网络下最好用的 Cloudflare 节点</p>
        </span>
      </header>

      <!--
        提示内容由脚本按服务端的实际情况填：开没开局域网、存的是不是旧版 Token、
        配置文件在哪。写死在 HTML 里只能二选一，而这几件事本来就因机器而异。
      -->
      <section class="login-note" id="login-note" hidden>
        <p id="login-note-main"></p>
        <p id="login-note-sub"></p>
        <code id="login-note-path" hidden></code>
      </section>

      <form id="login-form" novalidate>
        <label class="login-label" for="login-token" id="login-label">访问密码</label>
        <div class="login-field">
          <input
            id="login-token"
            type="password"
            placeholder="请输入访问密码"
            autocomplete="current-password"
            spellcheck="false"
            autofocus
          />
          <!-- 旧版 Token 有 64 位，看不见没法确认抄对了没有。 -->
          <button type="button" class="login-reveal" id="login-reveal" aria-label="显示密码">显示</button>
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" id="login-submit">进入面板</button>
      </form>

      <footer class="login-foot">
        <p>忘记密码？在运行面板的这台机器上打开面板，到设置页重设即可——本机访问不需要密码。</p>
      </footer>
    </main>
  </body>
</html>
