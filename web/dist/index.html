<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>CloudTrace</title>
    <!--
      图标与字体全部走本地：不引任何远程资源，加载更快也更可控。
      字体直接用系统字体栈，连一个字体文件都不下载。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏之前把主题与字号贴到根元素上，否则会先闪一下默认样式。
      // 读的是本地记忆的那份界面设置；读不出来就按跟随系统。
      ;(function () {
        var root = document.documentElement
        var ui = null
        try {
          var raw = localStorage.getItem('cloudtrace.ui')
          ui = raw ? JSON.parse(raw) : null
        } catch (e) {
          ui = null
        }
        var theme = (ui && ui.theme) || 'system'
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = theme
        root.dataset.fontScale = (ui && ui.fontScale) || 'medium'
        root.dataset.tableDensity = (ui && ui.tableDensity) || 'normal'
        root.dataset.animation = ui && ui.animation === false ? 'off' : 'on'
        root.dataset.contrast = ui && ui.contrast ? 'high' : 'normal'
      })()
    </script>
    <script type="module" crossorigin src="/assets/main-BqvIYQX0.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/base-kIHyFnVQ.js">
    <link rel="stylesheet" crossorigin href="/assets/base-PPGiVxNi.css">
    <link rel="stylesheet" crossorigin href="/assets/main-DwJHvmSG.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
