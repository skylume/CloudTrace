name: CI

# 只在 PR 与手动触发时跑。
#
# 刻意不在 push 时跑：这个仓库的提交大多是同一个人直接推的，每次提交都起一台
# runner 只会白烧额度，而门禁真正有价值的时机是「合并之前」那一次。需要临时
# 验证一次，用 Actions 页面上的「Run workflow」。
#
# 发布走 release.yml（打 tag 时触发），本文件不产出分发包。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Win7 线锁定的工具链保持一致，避免两套 Go 行为差异。
  GO_VERSION: '1.27.x'

jobs:
  check:
    name: 格式 / 静态检查 / 构建 / 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 竞态检测依赖 cgo，cgo 依赖 C 编译器；runner 上缺失时补装。
      - name: 确保 C 工具链可用
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            Write-Host "已找到 gcc：$((gcc --version | Select-Object -First 1))"
          }
          else {
            Write-Host '未找到 gcc，安装 MinGW'
            choco install mingw -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\mingw64\mingw64\bin'
          }

      # 前端产物经 go:embed 进二进制；已入库，但引入构建链后需重新生成。
      - name: 构建前端（若已引入构建链）
        shell: pwsh
        run: |
          if (Test-Path web/package.json) {
            Push-Location web
            npm ci
            if ($LASTEXITCODE -ne 0) { exit 1 }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Pop-Location
          }
          else {
            Write-Host 'web/package.json 不存在，使用已入库的 web/dist 产物'
          }
          if (-not (Test-Path web/dist/index.html)) {
            Write-Error 'web/dist/index.html 缺失，go:embed 会编译失败'
            exit 1
          }

      # 检查序列（格式、静态、构建、测试、覆盖率）放在脚本里，与本地跑的
      # 是**同一份命令**。
      #
      # 不把命令直接写在这里，是因为「改了 workflow 却没法在本地验证」这件事
      # 已经让 CI 红过两次：一次是跨步骤依赖磁盘上的 coverage.out，一次是
      # PowerShell 把包路径整串当成一个模式传给 go。抽成脚本之后，
      # `pwsh -File scripts/ci-check.ps1 -SkipRace` 跑的就是 CI 会跑的东西。
      - name: 检查（格式 / 静态 / 构建 / 测试 / 覆盖率）
        shell: pwsh
        run: ./scripts/ci-check.ps1 -CoverageThreshold 70

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7
