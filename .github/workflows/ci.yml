name: CI

# 只在 PR 与手动触发时跑。
#
# 刻意不在 push 时跑：这个仓库的提交大多是同一个人直接推的，每次提交都起一台
# runner 只会白烧额度，而门禁真正有价值的时机是「合并之前」那一次。需要临时
# 验证一次，用 Actions 页面上的「Run workflow」。
#
# 发布走 release.yml（打 tag 时触发），本文件不产出分发包。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Win7 线锁定的工具链保持一致，避免两套 Go 行为差异。
  GO_VERSION: '1.27.x'
  # 显式列出包路径，而不是 `./...`：web/node_modules 里有个 npm 包夹带了 Go
  # 源码（flatted），`./...` 会把它当成本模块的包一起编译、一起算覆盖率——
  # 它和这个项目毫无关系，哪天它编译不过就会连带把 CI 弄红。
  # **新增顶层目录时记得加进这里。**
  GO_PACKAGES: './assets/... ./cmd/... ./internal/...'

jobs:
  check:
    name: 格式 / 静态检查 / 构建 / 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 竞态检测依赖 cgo，cgo 依赖 C 编译器；runner 上缺失时补装。
      - name: 确保 C 工具链可用
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            Write-Host "已找到 gcc：$((gcc --version | Select-Object -First 1))"
          }
          else {
            Write-Host '未找到 gcc，安装 MinGW'
            choco install mingw -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\mingw64\mingw64\bin'
          }

      # 前端产物经 go:embed 进二进制；已入库，但引入构建链后需重新生成。
      - name: 构建前端（若已引入构建链）
        shell: pwsh
        run: |
          if (Test-Path web/package.json) {
            Push-Location web
            npm ci
            if ($LASTEXITCODE -ne 0) { exit 1 }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Pop-Location
          }
          else {
            Write-Host 'web/package.json 不存在，使用已入库的 web/dist 产物'
          }
          if (-not (Test-Path web/dist/index.html)) {
            Write-Error 'web/dist/index.html 缺失，go:embed 会编译失败'
            exit 1
          }

      - name: 格式检查
        shell: pwsh
        run: |
          $out = gofmt -l ./cmd ./internal ./web
          if ($out) {
            Write-Host '以下文件未格式化：'
            Write-Host $out
            exit 1
          }
          Write-Host 'gofmt 通过'

      - name: 静态检查
        shell: pwsh
        run: |
          go vet $env:GO_PACKAGES
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 构建（两个构建标签都要能编过）
        shell: pwsh
        run: |
          go build -tags panel $env:GO_PACKAGES
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go build -tags desktop $env:GO_PACKAGES
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 测试与覆盖率门禁**放在同一步**。
      #
      # 拆成两步时，第二步依赖第一步在磁盘上留下的 coverage.out——那个依赖曾经
      # 断过，而断掉时的日志里看不出原因（第一步一切正常、文件却不在）。放在
      # 同一步里，失败点与产出点就在同一段输出里，还多一行文件大小可以对照。
      - name: 单元测试 + 竞态检测 + 覆盖率门禁
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          $profile = Join-Path $env:GITHUB_WORKSPACE 'coverage.out'
          Remove-Item -Force $profile -ErrorAction SilentlyContinue

          go test $env:GO_PACKAGES -race -count=1 -timeout 600s -covermode=atomic -coverprofile=$profile
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if (-not (Test-Path $profile)) {
            Write-Error "测试跑完了却没有产出覆盖率文件：$profile"
            exit 1
          }
          Write-Host "覆盖率文件：$profile（$((Get-Item $profile).Length) 字节）"

          # 核心包低于阈值直接失败；里程碑未到达的包会被自动跳过。
          ./scripts/check-coverage.ps1 `
            -CoverProfile $profile `
            -Threshold 70 `
            -Package cloudtrace/internal/probe, cloudtrace/internal/source, cloudtrace/internal/scan, cloudtrace/internal/speed, cloudtrace/internal/history, cloudtrace/internal/score, cloudtrace/internal/geo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7
