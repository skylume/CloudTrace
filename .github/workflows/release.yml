name: Release

# 推一个 v* 标签即发版；也可以手动触发做一次「只出产物、不建 Release」的演练。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）。留空则用 tag 名去掉前缀 v'
        required: false
        default: ''

permissions:
  contents: write

env:
  GO_VERSION: '1.27.x'

jobs:
  # ---------------------------------------------------------------------
  # 解析版本号，并探测哪些发行版入口已经就绪。
  # 桌面版入口尚未实现时，相关 job 会被跳过而不是让整条流水线变红。
  # ---------------------------------------------------------------------
  prepare:
    name: 准备
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      desktop: ${{ steps.meta.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号与可用入口
        id: meta
        shell: pwsh
        run: |
          $ver = '${{ inputs.version }}'.Trim()
          # 只有 tag 才拿 ref 名当版本号。手动触发时 ref 是分支名，拿它当版本号会
          # 产出 cloudtrace-panel-main-win-x64.zip 这种包名——能用，但看的人得先
          # 想一下 main 是什么版本。
          if ([string]::IsNullOrWhiteSpace($ver) -and '${{ github.ref }}' -like 'refs/tags/*') {
            $ver = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = '0.0.0-dev' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

          $desktop = Test-Path cmd/desktop
          Add-Content -Path $env:GITHUB_OUTPUT -Value "desktop=$($desktop.ToString().ToLowerInvariant())"

          Write-Host "版本号：$ver"
          if (-not $desktop) {
            Write-Warning 'cmd/desktop 尚未实现：本次将跳过两个桌面版产物。'
          }

  # ---------------------------------------------------------------------
  # 前端只构建一次，产物通过 artifact 共享给后面 4 个构建 job。
  # ---------------------------------------------------------------------
  build-web:
    name: 构建前端（一次）
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建前端产物
        shell: pwsh
        run: |
          if (Test-Path web/package.json) {
            Push-Location web
            npm ci
            if ($LASTEXITCODE -ne 0) { exit 1 }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Pop-Location
          }
          else {
            Write-Host 'web/package.json 不存在，沿用已入库的 web/dist 产物'
          }
          if (-not (Test-Path web/dist/index.html)) {
            Write-Error 'web/dist/index.html 缺失，go:embed 会编译失败'
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: _web-dist
          path: web/dist
          retention-days: 1

  # ---------------------------------------------------------------------
  # 产物 1：面板版（官方 Go）
  # ---------------------------------------------------------------------
  panel-modern:
    name: 产物 1 · 面板版 Win10+
    needs: [prepare, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: _web-dist
          path: web/dist

      - name: 构建并打包
        shell: pwsh
        run: |
          ./scripts/release.ps1 -Only panel-modern -Version '${{ needs.prepare.outputs.version }}' -OutDir dist -SkipWeb -StageOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 上传的是包的内容而不是 zip：artifact 下载下来本来就会被 GitHub 再包一层，
      # 传 zip 会变成「解压两次才看到 exe」。zip 由汇总发布那一步统一生成。
      - uses: actions/upload-artifact@v4
        with:
          name: cloudtrace-panel-${{ needs.prepare.outputs.version }}-win-x64
          path: dist/pkg/cloudtrace-panel-${{ needs.prepare.outputs.version }}-win-x64
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 产物 2：桌面版（官方 Go）
  # ---------------------------------------------------------------------
  desktop-modern:
    name: 产物 2 · 桌面版 Win10+
    needs: [prepare, build-web]
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: _web-dist
          path: web/dist

      - name: 构建并打包
        shell: pwsh
        run: |
          ./scripts/release.ps1 -Only desktop-modern -Version '${{ needs.prepare.outputs.version }}' -OutDir dist -SkipWeb -StageOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win-x64
          path: dist/pkg/cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win-x64
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 产物 3：面板版（Win7 工具链）
  # ---------------------------------------------------------------------
  panel-win7:
    name: 产物 3 · 面板版 Win7
    needs: [prepare, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: _web-dist
          path: web/dist

      # 与主构建的官方 Go 完全隔离成两个 GOROOT，互不污染。
      - name: 准备 Win7 工具链
        shell: pwsh
        run: |
          ./scripts/fetch-toolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 构建并打包
        shell: pwsh
        run: |
          ./scripts/release.ps1 -Only panel-win7 -Version '${{ needs.prepare.outputs.version }}' -OutDir dist -SkipWeb -StageOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: cloudtrace-panel-${{ needs.prepare.outputs.version }}-win7-x64
          path: dist/pkg/cloudtrace-panel-${{ needs.prepare.outputs.version }}-win7-x64
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 产物 4 + 5：桌面版（Win7）lite 与 full
  # 同一个 job 内先打 lite，再复制一份加 webview2/ 打成 full。
  # ---------------------------------------------------------------------
  desktop-win7:
    name: 产物 4+5 · 桌面版 Win7（lite / full）
    needs: [prepare, build-web]
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: windows-latest
    env:
      # 可选的覆盖：给了它就从微软官方的固定版 .cab 取运行时（地址会过期，需要
      # 自己从下载页拿）。留空则从 nuget.org 上的 WebView2.Runtime.X64 取，
      # 那是长期有效的版本化地址，full 变体因此每次都能产出。
      WEBVIEW2_CAB_URL: ${{ vars.WEBVIEW2_CAB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: _web-dist
          path: web/dist

      - name: 准备 Win7 工具链
        shell: pwsh
        run: |
          ./scripts/fetch-toolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 构建并打包
        shell: pwsh
        run: |
          ./scripts/release.ps1 -Only desktop-win7 -Version '${{ needs.prepare.outputs.version }}' -OutDir dist -SkipWeb -StageOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # lite 与 full 是两个独立的包，因此是两个 artifact——一个 artifact 装两个包
      # 的话，下载下来还要先分辨里面哪份是哪个。
      - uses: actions/upload-artifact@v4
        with:
          name: cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win7-x64-lite
          path: dist/pkg/cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win7-x64-lite
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win7-x64-full
          path: dist/pkg/cloudtrace-desktop-${{ needs.prepare.outputs.version }}-win7-x64-full
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 汇总：把全部产物挂到同一个 Release。
  # ---------------------------------------------------------------------
  release:
    name: 汇总发布
    needs: [prepare, build-web, panel-modern, desktop-modern, panel-win7, desktop-win7]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查上游 job 是否全部成功
        shell: pwsh
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          $needs = $RESULTS | ConvertFrom-Json
          $bad = @()
          foreach ($name in $needs.PSObject.Properties.Name) {
            $result = $needs.$name.result
            # 被跳过的 job 是预期行为（入口尚未实现），不算失败。
            if ($result -eq 'failure' -or $result -eq 'cancelled') {
              $bad += "$name=$result"
            }
          }
          if ($bad.Count -gt 0) {
            Write-Error ("以下 job 未成功，终止发布：" + ($bad -join ', '))
            exit 1
          }

      # 每个 artifact 落在自己的子目录里（不要 merge-multiple），目录名就是包名
      # ——下一步要按目录逐个压成同名的 zip。
      - name: 收集全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: cloudtrace-*
          path: artifacts

      # 上游传的是包的内容，Release 要的是 zip，所以在这里统一压一次。
      #
      # 放在这一步而不是各构建 job 里：一个包只压一次，几百兆的 Win7 运行时
      # 不会被压两遍。
      - name: 打成 zip
        shell: pwsh
        run: |
          $dirs = Get-ChildItem -Path artifacts -Directory
          if ($dirs.Count -eq 0) {
            Write-Error 'artifacts 下没有任何包目录，终止'
            exit 1
          }
          foreach ($dir in $dirs) {
            $items = Get-ChildItem -Path $dir.FullName | ForEach-Object { $_.FullName }
            ./scripts/package.ps1 -Path $items -Destination (Join-Path 'artifacts' "$($dir.Name).zip")
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # 说明的生成逻辑放在脚本里：写在 workflow 里就只能等发版时才知道对不对，
      # 而这个脚本可以拿几个假文件名在本地跑一遍。
      - name: 生成 Release 说明
        shell: pwsh
        run: |
          ./scripts/release-notes.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -ArtifactDir artifacts `
            -Out RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 创建或更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = (Get-ChildItem artifacts -Filter '*.zip' | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            Write-Error '没有收集到任何产物，终止'
            exit 1
          }
          Write-Host "本次共 $($files.Count) 个产物："
          $files | ForEach-Object { Write-Host "    $_" }

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release 已存在，改为追加/覆盖产物'
            gh release upload $tag @files --clobber
          }
          else {
            gh release create $tag --title "CloudTrace $tag" --notes-file RELEASE_NOTES.md @files
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
